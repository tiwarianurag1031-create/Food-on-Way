<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Food on Way: find highway restaurants and dhabas on your route, pre-order, pay 50% advance and get food ready when you arrive.">
<meta name="theme-color" content="#0A6638">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 36 36'%3E%3Crect width='36' height='36' rx='10' fill='%230A6638'/%3E%3Cpath d='M9 29c3-7 15-6 15-13 0-3-2-5-5-5' fill='none' stroke='%23fff' stroke-width='3' stroke-linecap='round'/%3E%3Ccircle cx='24' cy='10' r='4.2' fill='%23F2B01E'/%3E%3C/svg%3E">
<title>Food on Way</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Hind:wght@400;500;600&family=Overpass:wght@400;600;700;800;900&family=Overpass+Mono:wght@500;600&display=swap">
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<style>
/* Layout: Indian highway signage system — NH-green sign panels for wayfinding, milestone-yellow for routes & ETAs, quiet white cards for food. */
:root{
  --bg:#F8FAF8; --surface:#FFFFFF; --surface-2:#EEF3EF; --ink:#12231A; --muted:#58695F; --line:#D9E2DB;
  --sign:#0A6638; --sign-2:#07502C; --on-sign:#FFFFFF;
  --mile:#F2B01E; --mile-soft:#FFF4D6; --on-mile:#2A1C00;
  --good:#1C7C45; --good-bg:#E2F2E8; --warn:#9A5B00; --warn-bg:#FFF0D4; --bad:#B3302A; --bad-bg:#FBE5E2; --info:#22599E; --info-bg:#E3EDF9;
  --veg:#1E8A3E; --nonveg:#9C2B1F; --qr-bg:#FFFFFF;
  --shadow:0 1px 2px rgba(14,40,26,.06),0 8px 24px rgba(14,40,26,.07);
  --f-display:"Overpass",ui-sans-serif,system-ui,sans-serif;
  --f-body:"Hind",ui-sans-serif,system-ui,sans-serif;
  --f-mono:"Overpass Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
  --r:14px; --r-sm:10px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0D1511; --surface:#141E19; --surface-2:#1B2721; --ink:#E5EEE8; --muted:#9BAEA3; --line:#293830;
  --sign:#1F8D52; --sign-2:#17733F; --on-sign:#FFFFFF; --mile:#F4B73A; --mile-soft:#3A2F12; --on-mile:#241800;
  --good:#5BC98A; --good-bg:#16301F; --warn:#F0B35A; --warn-bg:#3A2B12; --bad:#F08A80; --bad-bg:#3A1A17; --info:#86B5F0; --info-bg:#17263A;
  --veg:#4CC46F; --nonveg:#E0715F; --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.25); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0D1511; --surface:#141E19; --surface-2:#1B2721; --ink:#E5EEE8; --muted:#9BAEA3; --line:#293830;
  --sign:#1F8D52; --sign-2:#17733F; --on-sign:#FFFFFF; --mile:#F4B73A; --mile-soft:#3A2F12; --on-mile:#241800;
  --good:#5BC98A; --good-bg:#16301F; --warn:#F0B35A; --warn-bg:#3A2B12; --bad:#F08A80; --bad-bg:#3A1A17; --info:#86B5F0; --info-bg:#17263A;
  --veg:#4CC46F; --nonveg:#E0715F; --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.25); color-scheme:dark}

*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.55;-webkit-font-smoothing:antialiased}
h1,h2,h3,h4{font-family:var(--f-display);line-height:1.12;margin:0;text-wrap:balance;letter-spacing:-.01em}
h1{font-size:clamp(2rem,5.4vw,3.6rem);font-weight:900}
h2{font-size:clamp(1.5rem,3.2vw,2.1rem);font-weight:800}
h3{font-size:1.15rem;font-weight:800}
p{margin:0}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
a{color:var(--sign)}
:focus-visible{outline:3px solid var(--mile);outline-offset:2px;border-radius:6px}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums;letter-spacing:0}
.num{font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
.small{font-size:.875rem}
.xs{font-size:.78rem}
.label{font-family:var(--f-display);font-size:.72rem;font-weight:800;letter-spacing:.09em;text-transform:uppercase;color:var(--muted)}
.wrap{max-width:1180px;margin:0 auto;padding-inline:16px}
.stack{display:flex;flex-direction:column;gap:12px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.between{justify-content:space-between}
.grow{flex:1;min-width:0}
.section{padding-block:56px}
.section-sm{padding-block:28px}
@media (max-width:859px){.hide-m{display:none!important}}
@media (min-width:860px){.hide-d{display:none!important}}

/* Buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:1.5px solid transparent;border-radius:12px;padding:10px 16px;font-family:var(--f-display);font-weight:800;font-size:.92rem;letter-spacing:.02em;min-height:44px;background:var(--surface-2);color:var(--ink);transition:transform .08s ease,background .15s}
.btn:active{transform:translateY(1px)}
.btn-primary{background:var(--sign);color:var(--on-sign)}
.btn-primary:hover{background:var(--sign-2)}
.btn-mile{background:var(--mile);color:var(--on-mile)}
.btn-mile:hover{filter:brightness(.96)}
.btn-outline{background:transparent;border-color:var(--line)}
.btn-outline:hover{border-color:var(--sign);color:var(--sign)}
.btn-ghost{background:transparent}
.btn-ghost:hover{background:var(--surface-2)}
.btn-danger{background:var(--bad-bg);color:var(--bad)}
.btn-sm{min-height:36px;padding:6px 12px;font-size:.82rem;border-radius:10px}
.btn-lg{min-height:56px;padding:14px 22px;font-size:1.02rem;border-radius:14px}
.btn-block{width:100%}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.linkbtn{background:none;border:0;padding:0;color:var(--sign);font-weight:600;text-decoration:underline;text-underline-offset:3px}

/* Header */
.hdr{position:sticky;top:env(safe-area-inset-top,0px);z-index:40;background:color-mix(in srgb,var(--bg) 92%,transparent);backdrop-filter:saturate(1.4) blur(10px);border-bottom:1px solid var(--line)}
.hdr-in{display:flex;align-items:center;gap:14px;min-height:64px}
.logo{display:flex;align-items:center;gap:10px;background:none;border:0;padding:0;font-family:var(--f-display);font-weight:900;font-size:1.05rem;letter-spacing:.04em}
.logo small{display:block;font-size:.62rem;letter-spacing:.14em;color:var(--muted);font-weight:700}
.nav{display:none;gap:2px;margin-left:12px}
.nav button{background:none;border:0;padding:8px 11px;border-radius:9px;font-weight:600;color:var(--muted)}
.nav button:hover,.nav button.on{color:var(--ink);background:var(--surface-2)}
.hdr-actions{margin-left:auto;display:flex;gap:8px;align-items:center}
.iconbtn{position:relative;display:inline-grid;place-items:center;width:42px;height:42px;border-radius:12px;border:1px solid var(--line);background:var(--surface)}
.badge{position:absolute;top:-4px;right:-4px;min-width:18px;height:18px;border-radius:9px;background:var(--bad);color:#fff;font-size:.7rem;font-weight:700;display:grid;place-items:center;padding:0 4px}
@media (min-width:1020px){.nav{display:flex}.burger{display:none!important}}
.drawer{border-top:1px solid var(--line);padding-block:10px 16px}
.drawer button.navitem{display:block;width:100%;text-align:left;background:none;border:0;padding:12px 4px;font-family:var(--f-display);font-weight:700;font-size:1.05rem;border-bottom:1px solid var(--line)}

/* Cards & pills */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px}
.card-tight{padding:14px}
.pill{display:inline-flex;align-items:center;gap:6px;padding:3px 10px;border-radius:999px;font-family:var(--f-display);font-weight:800;font-size:.72rem;letter-spacing:.06em;text-transform:uppercase;background:var(--surface-2);color:var(--muted);white-space:nowrap}
.pill.good{background:var(--good-bg);color:var(--good)}
.pill.warn{background:var(--warn-bg);color:var(--warn)}
.pill.bad{background:var(--bad-bg);color:var(--bad)}
.pill.info{background:var(--info-bg);color:var(--info)}
.pill.mile{background:var(--mile);color:var(--on-mile)}
.pill.sign{background:var(--sign);color:var(--on-sign)}
.chip{display:inline-flex;align-items:center;gap:6px;padding:7px 13px;border-radius:999px;border:1.5px solid var(--line);background:var(--surface);font-weight:600;font-size:.86rem;white-space:nowrap}
.chip.on{border-color:var(--sign);background:var(--sign);color:var(--on-sign)}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chips.scroll{flex-wrap:nowrap;overflow-x:auto;padding-bottom:4px;scrollbar-width:thin}
.dot{width:8px;height:8px;border-radius:50%;background:currentColor;display:inline-block}
.facts{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:.86rem;color:var(--muted)}
.facts span{display:inline-flex;align-items:center;gap:5px}
.divider{height:1px;background:var(--line);margin:4px 0}

/* FSSAI veg / non-veg mark */
.fssai{display:inline-grid;place-items:center;width:16px;height:16px;border:1.6px solid var(--veg);border-radius:3px;flex:none}
.fssai i{width:7px;height:7px;border-radius:50%;background:var(--veg)}
.fssai.nv{border-color:var(--nonveg)}
.fssai.nv i{border-radius:0;width:0;height:0;background:none;border-left:4.5px solid transparent;border-right:4.5px solid transparent;border-bottom:8px solid var(--nonveg)}

/* Forms */
.field{display:flex;flex-direction:column;gap:6px;min-width:0}
.field label{font-family:var(--f-display);font-weight:700;font-size:.82rem;letter-spacing:.03em}
.input,select.input,textarea.input{width:100%;min-height:46px;padding:10px 12px;border-radius:11px;border:1.5px solid var(--line);background:var(--surface);color:var(--ink)}
textarea.input{min-height:84px;resize:vertical}
.input:focus{border-color:var(--sign);outline:none;box-shadow:0 0 0 3px color-mix(in srgb,var(--sign) 20%,transparent)}
.err{color:var(--bad);font-size:.82rem}
.form-grid{display:grid;grid-template-columns:1fr;gap:14px}
@media (min-width:640px){.form-grid.two{grid-template-columns:1fr 1fr}.form-grid .span2{grid-column:1/-1}}
.check{display:flex;gap:8px;align-items:center;font-weight:500}
.check input{width:18px;height:18px;accent-color:var(--sign)}

/* HERO: the search box is a green NH direction board */
.hero{padding-block:36px 44px;background:
  radial-gradient(1200px 400px at 85% -10%,color-mix(in srgb,var(--mile) 22%,transparent),transparent 60%),
  linear-gradient(180deg,var(--surface-2),var(--bg))}
.hero-grid{display:grid;gap:28px;align-items:center}
@media (min-width:960px){.hero-grid{grid-template-columns:1.05fr 1fr;gap:48px}}
.eyebrow{display:inline-flex;align-items:center;gap:8px;font-family:var(--f-display);font-weight:800;font-size:.78rem;letter-spacing:.12em;text-transform:uppercase;color:var(--sign)}
.hero h1 .accent{display:block;color:var(--sign)}
.hero .tag{font-size:1.12rem;color:var(--muted);max-width:34ch;margin-top:14px}
.hero-stats{display:flex;gap:22px;flex-wrap:wrap;margin-top:22px}
.hero-stats b{display:block;font-family:var(--f-display);font-size:1.5rem;font-weight:900}
.signboard{background:var(--sign);color:var(--on-sign);border-radius:18px;padding:8px;box-shadow:var(--shadow)}
.signboard-in{border:2.5px solid rgba(255,255,255,.92);border-radius:13px;padding:20px 18px 18px}
.signboard .sb-title{font-family:var(--f-display);font-weight:900;letter-spacing:.08em;font-size:.82rem;display:flex;align-items:center;gap:8px;margin-bottom:14px}
.signboard label{color:rgba(255,255,255,.85);font-family:var(--f-display);font-weight:800;font-size:.72rem;letter-spacing:.12em}
.signboard .input{border-color:transparent;background:#fff;color:#12231A;font-weight:600}
.signboard .input::placeholder{color:#6d7a72}
.sb-grid{display:grid;grid-template-columns:1fr;gap:12px}
.sb-route{display:grid;grid-template-columns:1fr auto 1fr;gap:8px;align-items:end}
.swap{width:44px;height:46px;border-radius:11px;border:0;background:rgba(255,255,255,.16);color:#fff;display:grid;place-items:center}
.sb-two{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media (max-width:520px){.sb-route{grid-template-columns:1fr}.swap{display:none}}

/* Milestone (Indian highway kilometre stone) */
.milestone{display:flex;flex-direction:column;align-items:center;text-align:center;background:none;border:0;padding:0;width:100%}
.ms-cap{width:100%;background:var(--mile);color:var(--on-mile);border-radius:60px 60px 0 0;padding:16px 8px 6px;font-family:var(--f-display);font-weight:900;font-size:.72rem;letter-spacing:.1em}
.ms-body{width:100%;background:var(--surface);border:1.5px solid var(--line);border-top:0;border-radius:0 0 8px 8px;padding:10px 8px 12px}
.ms-body b{display:block;font-family:var(--f-display);font-weight:900;font-size:1.02rem;letter-spacing:.03em;text-transform:uppercase}
.ms-body .mono{font-size:1.05rem;font-weight:600}
.milestone:hover .ms-body{border-color:var(--sign)}
.routes-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
@media (min-width:700px){.routes-grid{grid-template-columns:repeat(4,minmax(0,1fr))}}

/* How it works: an actual sequence drawn as a road */
.steps{display:grid;gap:14px;counter-reset:s}
@media (min-width:760px){.steps{grid-template-columns:repeat(3,1fr)}}
@media (min-width:1100px){.steps{grid-template-columns:repeat(6,1fr)}}
.step{position:relative;padding:16px 14px;border-radius:var(--r);background:var(--surface);border:1px solid var(--line)}
.step .n{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;background:var(--sign);color:var(--on-sign);font-family:var(--f-mono);font-weight:600;margin-bottom:10px}
.step h4{font-size:1rem;font-weight:800}
.why{display:grid;gap:12px;grid-template-columns:1fr}
@media (min-width:640px){.why{grid-template-columns:1fr 1fr}}
@media (min-width:1000px){.why{grid-template-columns:repeat(4,1fr)}}
.why .card h4{font-size:1rem;margin-bottom:4px}
.why .ico{width:38px;height:38px;border-radius:10px;background:var(--mile-soft);color:var(--ink);display:grid;place-items:center;margin-bottom:10px}

/* Results */
.result-head{background:var(--sign);color:var(--on-sign)}
.result-head .wrap{padding-block:16px}
.rh-route{font-family:var(--f-display);font-weight:900;font-size:1.35rem;letter-spacing:.02em}
.result-layout{display:grid;gap:18px;padding-block:18px 40px}
@media (min-width:1000px){.result-layout{grid-template-columns:minmax(0,1.15fr) minmax(0,1fr);align-items:start}.map-col{position:sticky;top:84px}}
.rcard{display:grid;grid-template-columns:1fr;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
@media (min-width:560px){.rcard{grid-template-columns:180px minmax(0,1fr)}}
.rcard.sel{border-color:var(--sign);box-shadow:0 0 0 2px var(--sign)}
.rcard .art{min-height:130px;position:relative}
.rcard .art svg{position:absolute;inset:0;width:100%;height:100%}
.rcard .body{padding:14px 16px;display:flex;flex-direction:column;gap:8px;min-width:0}
.rating{display:inline-flex;align-items:center;gap:4px;background:var(--good);color:#fff;border-radius:7px;padding:2px 7px;font-family:var(--f-display);font-weight:800;font-size:.82rem}
.eta-strip{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:1px;background:var(--line);border-radius:10px;overflow:hidden;border:1px solid var(--line)}
.eta-strip>div{background:var(--surface-2);padding:7px 9px}
.eta-strip b{display:block;font-family:var(--f-mono);font-weight:600;font-size:.95rem}
.filters{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px;display:flex;flex-direction:column;gap:12px}
.seg{display:inline-flex;background:var(--surface-2);border-radius:12px;padding:4px;gap:4px}
.seg button{border:0;background:none;padding:8px 14px;border-radius:9px;font-family:var(--f-display);font-weight:800;font-size:.85rem;color:var(--muted)}
.seg button.on{background:var(--surface);color:var(--ink);box-shadow:var(--shadow)}

/* Map */
.map{position:relative;background:var(--surface-2);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.map svg{display:block;width:100%;height:auto}
.map .m-grid{stroke:var(--line);stroke-width:1}
.map .m-route-case{stroke:var(--surface);stroke-width:11;fill:none;stroke-linecap:round;stroke-linejoin:round}
.map .m-route{stroke:var(--sign);stroke-width:6;fill:none;stroke-linecap:round;stroke-linejoin:round}
.map .m-route-done{stroke:var(--muted);stroke-width:6;fill:none;stroke-linecap:round;opacity:.5}
.map .m-city{fill:var(--surface);stroke:var(--ink);stroke-width:2}
.map .m-city-end{fill:var(--ink)}
.map .m-label{fill:var(--muted);font-family:var(--f-display);font-weight:700;font-size:12px}
.map .m-label-end{fill:var(--ink);font-weight:900;font-size:13px}
.map .mk{cursor:pointer}
.map .mk path{fill:var(--mile);stroke:var(--on-mile);stroke-width:1.5}
.map .mk.sel path{fill:var(--sign);stroke:var(--on-sign)}
.map .mk.closed path{fill:var(--surface);stroke:var(--muted)}
.map .mk text{fill:var(--on-mile);font-family:var(--f-mono);font-size:10px;font-weight:600}
.map .mk.sel text{fill:var(--on-sign)}
.map .car circle{fill:var(--info);stroke:var(--surface);stroke-width:3}
.map .car .pulse{fill:var(--info);opacity:.18}
.map-pop{position:absolute;left:10px;right:10px;bottom:10px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:8px}
@media (min-width:600px){.map-pop{right:auto;width:320px}}
.map-legend{position:absolute;top:10px;left:10px;display:flex;gap:10px;flex-wrap:wrap;background:color-mix(in srgb,var(--surface) 88%,transparent);border-radius:9px;padding:5px 9px;font-size:.74rem;color:var(--muted)}
.map-note{font-size:.74rem;color:var(--muted);padding:8px 12px;border-top:1px solid var(--line);background:var(--surface)}

/* Restaurant detail */
.banner{position:relative;border-radius:var(--r);overflow:hidden;aspect-ratio:16/7;max-width:100%;min-height:180px}
.banner svg{position:absolute;inset:0;width:100%;height:100%}
.gallery{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:8px}
.gallery div{aspect-ratio:4/3;border-radius:10px;overflow:hidden;position:relative}
.gallery svg{position:absolute;inset:0;width:100%;height:100%}
.detail-grid{display:grid;gap:18px}
@media (min-width:980px){.detail-grid{grid-template-columns:minmax(0,1.4fr) minmax(0,1fr);align-items:start}}
.journey{background:var(--sign);color:var(--on-sign);border-radius:var(--r);padding:18px}
.journey .label{color:rgba(255,255,255,.75)}
.jline{display:grid;grid-template-columns:18px 1fr;gap:4px 10px;margin:12px 0}
.jline .d{width:12px;height:12px;border-radius:50%;border:2.5px solid #fff;margin-top:6px}
.jline .d.f{background:var(--mile);border-color:var(--mile)}
.jline .v{width:2px;height:18px;background:rgba(255,255,255,.4);margin-left:5px}
.jstats{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.jstats>div{background:rgba(255,255,255,.1);border-radius:10px;padding:10px}
.jstats b{display:block;font-family:var(--f-mono);font-size:1.15rem;font-weight:600}
.jstats .hl{background:var(--mile);color:var(--on-mile)}
.jstats .hl .label{color:var(--on-mile);opacity:.75}
.kv{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;font-size:.92rem}
.kv dt{color:var(--muted)}
.kv dd{margin:0;font-weight:500}

/* Menu */
.menu-layout{display:grid;gap:20px;padding-block:18px 120px}
@media (min-width:1000px){.menu-layout{grid-template-columns:minmax(0,1fr) 360px;align-items:start;padding-bottom:48px}.cart-side{position:sticky;top:84px}}
.cat-tabs{position:sticky;top:calc(64px + env(safe-area-inset-top,0px));z-index:20;background:var(--bg);padding-block:10px;border-bottom:1px solid var(--line)}
.items{display:grid;grid-template-columns:1fr;gap:12px}
@media (min-width:700px){.items{grid-template-columns:1fr 1fr}}
.item{display:grid;grid-template-columns:minmax(0,1fr) 104px;gap:12px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px}
.item.oos{opacity:.55}
.item h4{font-family:var(--f-display);font-weight:800;font-size:1rem;margin:4px 0 2px}
.dish{position:relative;width:104px;height:96px;border-radius:12px;overflow:hidden}
.dish svg{width:100%;height:100%;display:block}

                   Each has a MOCK implementation here. Swap CONFIG.providers to a
                   real adapter (Google Maps Platform, Razorpay, MSG91/Gupshup,
                   SES) without touching UI code.

const CONFIG = {

const STORE_KEY = 'fow_db_v3';

/* ---------- small utils ---------- */
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const inr = n => '₹' + Math.round(n || 0).toLocaleString('en-IN');
const uid = p => p + '_' + Math.random().toString(36).slice(2, 9);
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const simNow = () => Date.now() + (DB.simOffset || 0);
const fmtT = d => new Date(d).toLocaleTimeString('en-IN', { hour:'numeric', minute:'2-digit', hour12:true }).toUpperCase();
const fmtD = d => new Date(d).toLocaleDateString('en-IN', { day:'numeric', month:'short' });
const fmtDT = d => fmtD(d) + ', ' + fmtT(d);
const mins = ms => Math.round(ms / 60000);
const hashN = s => { let h = 2166136261; for (const c of String(s)) { h ^= c.charCodeAt(0); h = Math.imul(h, 16777619); } return Math.abs(h); };
const maskMobile = m => m ? m.slice(0, 2) + 'xxxxxx' + m.slice(-2) : '';
const firstName = n => (n || '').split(' ')[0];
const todayISO = () => { const d = new Date(simNow()); return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0'); };
const nextSlot = () => { const d = new Date(simNow() + 30*60000); d.setMinutes(d.getMinutes() < 30 ? 30 : 60, 0, 0); return String(d.getHours()).padStart(2,'0') + ':' + String(d.getMinutes()).padStart(2,'0'); };
const fakeHash = p => 'bcrypt$2b$12$' + hashN('salt:' + p).toString(36).padEnd(22, 'x'); // production: bcrypt/argon2 on server

/* ---------- geography (mock route provider data) ---------- */
const CITY = {

  Haridwar:[29.9457,78.1642], Raiwala:[30.0200,78.2100], Rishikesh:[30.0869,78.2676], Gurugram:[28.4595,77.0266],
  Manesar:[28.3570,76.9380], Neemrana:[27.9880,76.3840], Behror:[27.8880,76.2840], Kotputli:[27.7020,76.1990],
  Shahpura:[27.3890,75.9590], Jaipur:[26.9124,75.7873], Noida:[28.5355,77.3910], 'Pari Chowk':[28.4650,77.5100],
  Jewar:[28.1300,77.5600], 'Mathura Jn':[27.5500,77.6200], Agra:[27.1767,78.0081], Mathura:[27.4924,77.6737],
  Vrindavan:[27.5806,77.7006], Murthal:[29.0300,77.0700], Panipat:[29.3909,76.9635], Karnal:[29.6857,76.9905],

const ROUTES = {

const CITY_ALIASES = { 'new delhi':'Delhi', 'delhi ncr':'Delhi', 'dehra dun':'Dehradun', 'chd':'Chandigarh' };
const normCity = s => { const k = String(s||'').trim().toLowerCase(); if (CITY_ALIASES[k]) return CITY_ALIASES[k]; const all = ['Delhi', ...Object.keys(ROUTES)]; return all.find(c => c.toLowerCase() === k) || null; };

const Geo = {
  xy(p, lat0) { return [p.lng * 111.32 * Math.cos(lat0 * Math.PI/180), p.lat * 110.57]; },
  nearest(points, p) {
    const lat0 = points[0].lat; let best = { d: 1e9, along: 0 }, acc = 0;
    const P = this.xy(p, lat0);
    for (let i = 0; i < points.length - 1; i++) {
      const A = this.xy(points[i], lat0), B = this.xy(points[i+1], lat0);
      const dx = B[0]-A[0], dy = B[1]-A[1], L2 = dx*dx + dy*dy, L = Math.sqrt(L2);
      const t = clamp(((P[0]-A[0])*dx + (P[1]-A[1])*dy) / L2, 0, 1);
      const d = Math.hypot(P[0] - (A[0] + t*dx), P[1] - (A[1] + t*dy));
      if (d < best.d) best = { d, along: acc + t*L };
      acc += L;
    }
    best.total = acc; return best;
  },
  length(points) { return this.nearest(points, points[points.length-1]).total; },
  pointAt(points, along) {
    const lat0 = points[0].lat; let acc = 0;
    for (let i = 0; i < points.length - 1; i++) {
      const A = this.xy(points[i], lat0), B = this.xy(points[i+1], lat0), L = Math.hypot(B[0]-A[0], B[1]-A[1]);
      if (acc + L >= along) { const t = (along - acc) / L; return { lat: points[i].lat + t*(points[i+1].lat - points[i].lat), lng: points[i].lng + t*(points[i+1].lng - points[i].lng) }; }
      acc += L;
    }
    return points[points.length-1];
  },
  sliceTo(points, along) {
    const lat0 = points[0].lat, out = [points[0]]; let acc = 0;
    for (let i = 0; i < points.length - 1; i++) {
      const A = this.xy(points[i], lat0), B = this.xy(points[i+1], lat0), L = Math.hypot(B[0]-A[0], B[1]-A[1]);
      if (acc + L >= along) { out.push(this.pointAt(points, along)); return out; }
      out.push(points[i+1]); acc += L;
    }
    return out;
  }
};

/* ---------- providers (mock implementations; same interface as real adapters) ---------- */
const RouteProvider = { // production: Google Directions / Routes API
  getRoute(from, to) {
    const f = normCity(from), t = normCity(to);
    if (!f || !t || f === t) return null;
    let key, reverse = false;
    if (f === 'Delhi' && ROUTES[t]) key = t; else if (t === 'Delhi' && ROUTES[f]) { key = f; reverse = true; } else return null;
    const def = ROUTES[key];
    let via = def.via.slice(); if (reverse) via.reverse();
    const points = via.map(n => ({ name: n, lat: CITY[n][0], lng: CITY[n][1] }));
    return { id: (reverse ? key + '-Delhi' : 'Delhi-' + key), from: f, to: t, hw: def.hw, roadKm: def.km, points, straightKm: Geo.length(points), driveMin: Math.round(def.km / DB.settings.avgSpeedKmh * 60) };
  }
};
const TrafficProvider = { // production: Distance Matrix / Routes API with departure_time + traffic_model
  levels: { Light: 1, Moderate: 0.78, Heavy: 0.5 },
  forecast(key, at) {
    const h = new Date(at).getHours(); const seed = hashN(key + ':' + h);
    const peak = (h >= 8 && h <= 10) || (h >= 17 && h <= 20);
    const r = seed % 100; const level = r < (peak ? 25 : 50) ? 'Light' : r < (peak ? 70 : 88) ? 'Moderate' : 'Heavy';
    const delayMin = level === 'Light' ? seed % 4 : level === 'Moderate' ? 6 + seed % 9 : 14 + seed % 12;
    return { level, delayMin };
  },
  live(prev) { const r = Math.random(); if (r > 0.18) return prev; return r < 0.07 ? 'Heavy' : r < 0.13 ? 'Moderate' : 'Light'; }
};
const PaymentGateway = { // production: Razorpay Orders API → Checkout → server-side signature verification → webhooks
  name: 'Razorpay (test mode)',
  createOrder(amount) { return { gateway_order_id: 'order_' + uid('').slice(1), amount: Math.round(amount * 100), currency: 'INR' }; },
  capture(gwOrder, method, fail) { return fail ? { ok: false, error: 'Payment declined by bank (test)' } : { ok: true, transaction_id: 'pay_' + Math.random().toString(36).slice(2, 16).toUpperCase(), method }; }
};
const Notifier = { // production: MSG91/Gupshup (SMS, WhatsApp), SES/SendGrid (email), FCM (push)
  send(to, type, title, body, channels = ['push']) {
    DB.notifications.unshift({ id: uid('n'), to, type, title, body, channels, at: simNow(), read: false });
    DB.notifications = DB.notifications.slice(0, 300);
  }
};

const minutesOf = s => { const [h, m] = s.split(':').map(Number); return h * 60 + m; };
function isOpenAt(r, at) {
  if (r.open === '00:00' && r.close === '24:00') return true;
  const d = new Date(at), m = d.getHours() * 60 + d.getMinutes(), o = minutesOf(r.open), c = minutesOf(r.close);
  return c > o ? (m >= o && m < c) : (m >= o || m < c);
}
const is247 = r => r.open === '00:00' && r.close === '24:00';
const hoursLabel = r => is247(r) ? 'Open 24x7' : fmtT(new Date('2026-01-01T' + r.open)) + ' – ' + fmtT(new Date('2026-01-01T' + (r.close === '24:00' ? '23:59' : r.close)));

/* ---------- services ---------- */
const SearchService = {
  run(q) {
    const route = RouteProvider.getRoute(q.from, q.to);
    if (!route) return { error: true };
    const depart = new Date(q.date + 'T' + q.time).getTime();
    const factor = route.roadKm / route.straightKm;
    const list = DB.restaurants.filter(r => r.status === 'APPROVED').map(r => {
      const n = Geo.nearest(route.points, r);
      if (n.d > DB.settings.maxDetourKm) return null;
      const distKm = Math.max(0.2, n.d);
      const roadAlong = Math.round(n.along * factor);
      const detourMin = Math.round(distKm * 2 / 30 * 60) + 1;
      const t = TrafficProvider.forecast(r.id + route.id, depart + roadAlong / DB.settings.avgSpeedKmh * 3600000);
      const baseEta = depart + (roadAlong / DB.settings.avgSpeedKmh * 60 + detourMin / 2) * 60000;
      const eta = baseEta + t.delayMin * 60000;
      const openAtEta = isOpenAt(r, eta);
      const minPrice = Math.min(...DB.menu_items.filter(m => m.restaurant_id === r.id).map(m => m.price));
      return { r, distKm, detourMin, roadAlong, baseEta, eta, traffic: t.level, delayMin: t.delayMin, openAtEta, openNow: isOpenAt(r, simNow()), along: n.along, minPrice };
    }).filter(Boolean).sort((a, b) => a.roadAlong - b.roadAlong);
    return { route, depart, list };
  },
  score(x) { return x.r.rating * 2 - x.detourMin / 8 + (x.openAtEta ? 3 : -6) - x.r.avgPrep / 30 + (x.r.featured ? 0.6 : 0); }
};

const EtaService = {
  current(o) { return o.journey ? o.journey.eta : o.eta_current; },
  log(o, extra = {}) {
    const j = o.journey || {}; const pos = j.pos || {};
    DB.eta_logs.push({ id: uid('eta'), order_id: o.id, timestamp: simNow(), latitude: pos.lat || null, longitude: pos.lng || null, estimated_arrival: this.current(o), traffic: j.traffic || o.traffic, traffic_delay: j.delayMin ?? o.delayMin ?? 0, remaining_km: j.remainingKm ?? null, actual_arrival: o.actual_arrival || null, ...extra });
  },
  startJourney(o) {
    const route = RouteProvider.getRoute(o.route_from, o.route_to);
    const r = rest(o.restaurant_id);
    const n = Geo.nearest(route.points, r);
    const factor = route.roadKm / route.straightKm;
    const totalKm = Math.max(4, Math.round(n.along * factor) + o.detourKm);
    o.journey = { active: true, paused: false, totalKm, remainingKm: totalKm, traffic: o.traffic || 'Moderate', delayMin: 0, eta: 0, pos: route.points[0], factor, startedAt: simNow(), lastNotifiedEta: null, approaching: false, atGate: false };
    this.recalc(o, true);
    Notifier.send({ role:'restaurant', id:o.restaurant_id }, 'journey', 'Customer has started the journey', `${o.order_number}: ${firstName(o.customer.name)} is ${totalKm} km away. ETA ${fmtT(o.journey.eta)}.`, ['push','sms']);
  },
  recalc(o, first) {
    const j = o.journey, sp = DB.settings.avgSpeedKmh, f = TrafficProvider.levels[j.traffic];
    const freeMin = j.remainingKm / sp * 60, actMin = freeMin / f;
    j.delayMin = Math.round(actMin - freeMin);
    const oldEta = j.eta;
    j.eta = simNow() + actMin * 60000;
    o.eta_current = j.eta; o.traffic = j.traffic; o.delayMin = j.delayMin;
    const route = RouteProvider.getRoute(o.route_from, o.route_to);
    j.pos = Geo.pointAt(route.points, clamp((j.totalKm - j.remainingKm) / j.factor, 0, 1e6));
    if (first) { j.lastNotifiedEta = j.eta; this.log(o); return; }
    const shift = mins(j.eta - j.lastNotifiedEta);
    if (Math.abs(shift) >= DB.settings.etaAlertThresholdMin) {
      const txt = `ETA changed ${fmtT(j.lastNotifiedEta)} → ${fmtT(j.eta)} (${j.traffic} traffic)`;
      Notifier.send({ role:'restaurant', id:o.restaurant_id }, 'eta', 'TRAFFIC UPDATE · ' + o.order_number, txt + '. Preparation time adjusted.', ['push']);
      Notifier.send({ role:'customer', id:o.customer_id }, 'eta', shift > 0 ? 'Traffic delay on your route' : 'You are running early', txt + '. The restaurant has been informed.', ['push','whatsapp']);
      o.etaChanges = (o.etaChanges || []); o.etaChanges.unshift({ from: j.lastNotifiedEta, to: j.eta, at: simNow(), traffic: j.traffic });
      j.lastNotifiedEta = j.eta; this.log(o);
    } else if (Math.abs(mins(j.eta - (oldEta || j.eta))) >= 1) this.log(o);
    const left = mins(j.eta - simNow());
    if (!j.approaching && left <= DB.settings.approachingMin) {
      j.approaching = true;
      Notifier.send({ role:'restaurant', id:o.restaurant_id }, 'approaching', 'Customer approaching', `${o.order_number} is about ${left} min away. Table ${o.table_number || 'to assign'}.`, ['push']);
      Notifier.send({ role:'customer', id:o.customer_id }, 'approaching', 'Almost there', `${rest(o.restaurant_id).name} is about ${left} min away.`, ['push']);
    }
  },
  tick() {
    const active = DB.orders.filter(o => o.journey && o.journey.active && !o.journey.paused);
    if (!active.length) return false;
    DB.simOffset = (DB.simOffset || 0) + CONFIG.simMinutesPerTick * 60000;
    active.forEach(o => {
      const j = o.journey;
      j.traffic = TrafficProvider.live(j.traffic);
      j.remainingKm = Math.max(0, j.remainingKm - DB.settings.avgSpeedKmh * TrafficProvider.levels[j.traffic] * CONFIG.simMinutesPerTick / 60);
      if (j.remainingKm <= 0.05) {
        j.remainingKm = 0; j.active = false; j.atGate = true; j.eta = simNow(); o.eta_current = j.eta;
        Notifier.send({ role:'restaurant', id:o.restaurant_id }, 'arrived', 'Customer at the restaurant', `${o.order_number}: verify order number, QR and table ${o.table_number || ''}.`, ['push']);
        this.log(o);
      } else this.recalc(o);
      PrepEngine.alert(o);
    });
    save(); return true;
  }
};

const PrepEngine = {
  compute(o) {
    const items = o.items;
    const itemPrep = Math.max(...items.map(i => i.prep));
    const qty = items.reduce((s, i) => s + i.qty, 0);
    const volumeMin = Math.min(10, Math.max(0, qty - 4));
    const workloadOrders = DB.orders.filter(x => x.restaurant_id === o.restaurant_id && x.id !== o.id && ['ACCEPTED','PREPARING'].includes(x.status)).length;
    const workloadMin = workloadOrders * DB.settings.workloadMinPerOrder;
    const buffer = DB.settings.bufferMin;
    const prepMin = itemPrep + volumeMin;
    const eta = EtaService.current(o);
    const startAt = eta - (prepMin + workloadMin + buffer) * 60000;
    const readyBy = eta - buffer * 60000;
    const minsToStart = mins(startAt - simNow());
    let rec;
    if (['READY','ARRIVED','SERVED','COMPLETED'].includes(o.status)) rec = 'Food is ready — keep warm and plate on arrival.';
    else if (o.status === 'PREPARING') rec = `Cooking. Target ready by ${fmtT(readyBy)}.`;
    else if (minsToStart > 0) rec = `Start preparing at ${fmtT(startAt)} (in ${minsToStart} min).`;
    else rec = 'Start preparing now.';
    return { itemPrep, volumeMin, workloadOrders, workloadMin, buffer, prepMin, eta, startAt, readyBy, minsToStart, rec };
  },
  alert(o) {
    if (!['ACCEPTED','CONFIRMED'].includes(o.status)) return;
    const p = this.compute(o);
    if (p.minsToStart <= 0 && !o.prepAlerted) {
      o.prepAlerted = true;
      Notifier.send({ role:'restaurant', id:o.restaurant_id }, 'prep', 'Start preparing ' + o.order_number, `Customer ETA ${fmtT(p.eta)}. ${p.prepMin} min cook + ${p.buffer} min buffer.`, ['push']);
    }
  }
};

const TableService = {
  assign(rid, people) {
    const free = DB.tables.filter(t => t.restaurant_id === rid && t.status === 'AVAILABLE' && t.capacity >= people).sort((a, b) => a.capacity - b.capacity);
    const t = free[0]; if (!t) return null; t.status = 'RESERVED'; return t.number;   // atomic UPDATE ... WHERE status='AVAILABLE' in production
  },
  release(rid, number, status = 'AVAILABLE') { const t = DB.tables.find(x => x.restaurant_id === rid && x.number === number); if (t) t.status = status; }
};

const OrderService = {
  price(rid, lines, couponCode) {
    const s = DB.settings;
    const subtotal = lines.reduce((a, l) => a + l.price * l.qty, 0);
    const c = couponCode ? DB.coupons.find(x => x.code === couponCode.toUpperCase() && x.active) : null;
    const discount = c ? Math.min(c.max, Math.round(subtotal * c.pct / 100)) : 0;
    const gst = Math.round((subtotal - discount) * s.gstPct / 100);
    const fee = lines.length ? s.platformFee : 0;
    const total = subtotal - discount + gst + fee;
    const advance = Math.round(total * s.advancePct / 100);
    return { subtotal, discount, coupon: c ? c.code : null, gst, fee, total, advance, balance: total - advance };
  },
  create(ctx, payment) {
    const r = rest(ctx.rid), s = DB.settings;
    if (r.status !== 'APPROVED') throw new Error('Restaurant is not accepting orders.');
    if (!ctx.seed && !isOpenAt(r, ctx.eta)) throw new Error('Restaurant will be closed at your arrival time.');
    DB.seq += 1;
    const order_number = 'FW-' + new Date(simNow()).getFullYear() + '-' + String(DB.seq).padStart(6, '0');
    const table = TableService.assign(r.id, ctx.diners);
    const commission = Math.round((ctx.price.subtotal - ctx.price.discount) * s.commissionPct / 100);
    const o = {
      id: uid('o'), order_number, customer_id: ctx.customerId, restaurant_id: r.id, route_from: ctx.from, route_to: ctx.to, route: ctx.from + ' → ' + ctx.to,
      items: ctx.lines.map(l => ({ menu_item_id: l.id, name: l.name, price: l.price, qty: l.qty, veg: l.veg, prep: l.prep })),

  setStatus(o, st) {
    o.status = st; o.history.push({ s: st, at: simNow() });
    const r = rest(o.restaurant_id);
    const msg = { ACCEPTED: ['Restaurant accepted your order', `${r.name} will time your food to your ETA.`], PREPARING: ['Preparation started', `${r.name} has started cooking.`], READY: ['Food is ready', `Your food at ${r.name} is ready.`], ARRIVED: ['Welcome!', `Table ${o.table_number || ''} is ready for you.`], COMPLETED: ['Order completed', 'Thanks for travelling with Food on Way. Rate your stop.'] }[st];
    if (msg) Notifier.send({ role:'customer', id:o.customer_id }, st.toLowerCase(), msg[0], msg[1], st === 'COMPLETED' ? ['push','email'] : ['push','whatsapp']);
    if (st === 'PREPARING') o.prep_started_at = simNow();
    if (st === 'READY') o.food_ready_at = simNow();
    if (st === 'ARRIVED') { o.actual_arrival = simNow(); if (o.journey) { o.journey.active = false; o.journey.atGate = true; } if (o.table_number) TableService.release(o.restaurant_id, o.table_number, 'OCCUPIED'); EtaService.log(o, { actual_arrival: simNow() }); }
    if (st === 'SERVED') {
      o.served_at = simNow(); o.payment_status = 'PAID';
      DB.payments.unshift({ id: uid('p'), order_id: o.id, amount: o.balance_amount, payment_type: 'BALANCE', method: 'At restaurant', gateway: 'Restaurant counter', status: 'SUCCESS', transaction_id: 'cnt_' + Math.random().toString(36).slice(2, 10).toUpperCase(), created_at: simNow() });
      if (o.table_number) TableService.release(o.restaurant_id, o.table_number, 'CLEANING');
      o.status = 'COMPLETED'; o.history.push({ s: 'COMPLETED', at: simNow() }); o.completed_at = simNow();
      Notifier.send({ role:'customer', id:o.customer_id }, 'completed', 'Order completed', 'Thanks for travelling with Food on Way. Rate your stop.', ['push','email']);
    }
    save();
  },
  cancelPolicy(o) {
    const p = PrepEngine.compute(o), s = DB.settings;
    if (['PREPARING','READY','ARRIVED','SERVED','COMPLETED','CANCELLED','REFUNDED'].includes(o.status)) return { allowed: false, refund: 0, reason: 'Food preparation has already started.' };
    const full = p.minsToStart >= s.freeCancelMinBeforePrep;
    return { allowed: true, refund: Math.round(o.advance_amount * (full ? 100 : s.lateCancelRefundPct) / 100), pct: full ? 100 : s.lateCancelRefundPct };
  },
  cancel(o, by, reason) {
    const pol = by === 'customer' ? this.cancelPolicy(o) : { refund: o.advance_amount, pct: 100 };
    o.status = by === 'restaurant' ? 'CANCELLED' : 'CANCELLED'; o.history.push({ s: 'CANCELLED', at: simNow(), by, reason });
    if (o.journey) o.journey.active = false;
    if (o.table_number) TableService.release(o.restaurant_id, o.table_number);
    if (pol.refund > 0) {
      o.refund_amount = pol.refund; o.payment_status = 'REFUNDED'; o.status = 'REFUNDED'; o.history.push({ s: 'REFUNDED', at: simNow() });
      DB.payments.unshift({ id: uid('p'), order_id: o.id, amount: -pol.refund, payment_type: 'REFUND', method: 'Original method', gateway: PaymentGateway.name, status: 'SUCCESS', transaction_id: 'rfnd_' + Math.random().toString(36).slice(2, 12).toUpperCase(), created_at: simNow() });
    }
    Notifier.send({ role:'customer', id:o.customer_id }, 'cancel', 'Order cancelled · ' + o.order_number, (reason ? reason + '. ' : '') + (pol.refund ? `${inr(pol.refund)} refund initiated (5–7 working days).` : 'No refund applicable.'), ['sms','email']);
    Notifier.send({ role:'restaurant', id:o.restaurant_id }, 'cancel', 'Order cancelled · ' + o.order_number, `Cancelled by ${by}. Table released.`, ['push']);
    save(); return pol;
  },
  canReject(o) {
    const rule = DB.settings.rejectRule;
    if (rule === 'never') return false;
    if (!['CONFIRMED','ACCEPTED'].includes(o.status)) return false;
    if (rule === 'within_10') return mins(simNow() - o.created_at) <= 10;
    return PrepEngine.compute(o).minsToStart > 0;
  }
};

function mapSVG(points, markers = [], opts = {}) {
  const W = 640, H = opts.h || 420, pad = 46;
  const all = points.concat(markers.map(m => ({ lat: m.r.lat, lng: m.r.lng })));
  const lat0 = points[0].lat, cos = Math.cos(lat0 * Math.PI / 180);
  const xs = all.map(p => p.lng * cos), ys = all.map(p => p.lat);
  const minX = Math.min(...xs), maxX = Math.max(...xs), minY = Math.min(...ys), maxY = Math.max(...ys);
  const sc = Math.min((W - pad*2) / (maxX - minX || 1), (H - pad*2) / (maxY - minY || 1));
  const ox = (W - (maxX - minX) * sc) / 2, oy = (H - (maxY - minY) * sc) / 2;
  const P = p => [ox + (p.lng * cos - minX) * sc, H - (oy + (p.lat - minY) * sc)];
  const path = pts => pts.map((p, i) => (i ? 'L' : 'M') + P(p).map(v => v.toFixed(1)).join(' ')).join(' ');
  let g = '';
  for (let x = 0; x <= W; x += 40) g += `<line class="m-grid" x1="${x}" y1="0" x2="${x}" y2="${H}"/>`;
  for (let y = 0; y <= H; y += 40) g += `<line class="m-grid" x1="0" y1="${y}" x2="${W}" y2="${y}"/>`;
  let svg = `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Route map">${g}<path class="m-route-case" d="${path(points)}"/><path class="m-route" d="${path(points)}"/>`;
  if (opts.done) svg += `<path class="m-route-done" d="${path(opts.done)}"/>`;
  points.forEach((p, i) => {
    const [x, y] = P(p), end = i === 0 || i === points.length - 1;
    const anchor = x > W - 90 ? 'end' : x < 90 ? 'start' : 'middle';
    svg += `<circle class="m-city ${end ? 'm-city-end' : ''}" cx="${x}" cy="${y}" r="${end ? 7 : 4.5}"/><text class="m-label ${end ? 'm-label-end' : ''}" x="${x + (anchor === 'start' ? 10 : anchor === 'end' ? -10 : 0)}" y="${y + (end ? -14 : 18)}" text-anchor="${anchor}">${esc(p.name)}</text>`;
  });
  markers.forEach((m, i) => {
    const [x, y] = P({ lat: m.r.lat, lng: m.r.lng });
    svg += `<g class="mk ${S.selected === m.r.id ? 'sel' : ''} ${m.openAtEta === false ? 'closed' : ''}" data-act="marker" data-id="${m.r.id}" transform="translate(${x.toFixed(1)} ${y.toFixed(1)})" tabindex="0" role="button" aria-label="${esc(m.r.name)}"><path d="M0 0 C-4 -8 -13 -12 -13 -22 a13 13 0 0 1 26 0 C13 -12 4 -8 0 0Z"/><text x="0" y="-18" text-anchor="middle">${i + 1}</text></g>`;
  });
  if (opts.car) { const [x, y] = P(opts.car); svg += `<g class="car"><circle class="pulse" cx="${x}" cy="${y}" r="14"/><circle cx="${x}" cy="${y}" r="8"/></g>`; }
  return svg + '</svg>';
}

function applyFilters(list) {
  const f = S.f;
  let L = list.filter(x => x.r.rating >= f.minRating && x.distKm <= f.maxDist && x.detourMin <= f.maxDetour && (!f.price || x.r.priceLevel <= f.price)
    && (!f.pureVeg || x.r.vegType === 'pure-veg') && (!f.nonVeg || x.r.vegType === 'mixed') && (!f.veg || true)
    && (!f.family || x.r.facilities.family) && (!f.dhaba || x.r.type === 'Dhaba') && (!f.parking || x.r.facilities.parking) && (!f.washroom || x.r.facilities.washroom)
    && (!f.openNow || x.openNow) && (!f.h24 || is247(x.r)) && (!f.fast || x.r.avgPrep <= 15) && (!f.high || x.r.rating >= 4.4));
  const sorters = { recommended: (a, b) => SearchService.score(b) - SearchService.score(a), rating: (a, b) => b.r.rating - a.r.rating, nearest: (a, b) => a.distKm - b.distKm, detour: (a, b) => a.detourMin - b.detourMin, prep: (a, b) => a.r.avgPrep - b.r.avgPrep, price: (a, b) => a.r.costForTwo - b.r.costForTwo, order: (a, b) => a.roadAlong - b.roadAlong };
  return L.slice().sort(sorters[S.sort]);
}

  if (!S.results || S.results.error) S.results = SearchService.run(S.q);
  let x = S.results.list && S.results.list.find(y => y.r.id === rid);
  if (!x) { // opened outside a matching search: find its corridor
    const key = Object.keys(ROUTES).find(k => Geo.nearest(RouteProvider.getRoute('Delhi', k).points, rest(rid)).d <= DB.settings.maxDetourKm);
    if (!key) return null;
    S.q = { ...S.q, from: 'Delhi', to: key }; S.results = SearchService.run(S.q); x = S.results.list.find(y => y.r.id === rid);
  }
  return x;
}

/* ---- LIVE TRACKING ---- */
function viewTrack() {
  const o = order(S.params.id); const u = me();
  if (!canSee(o, u)) return accessDenied();
  const r = rest(o.restaurant_id); const route = RouteProvider.getRoute(o.route_from, o.route_to);
  const n = Geo.nearest(route.points, r); const pts = Geo.sliceTo(route.points, n.along);
  pts[pts.length - 1] = { ...pts[pts.length - 1], name: r.name };
  const j = o.journey; const eta = EtaService.current(o); const p = PrepEngine.compute(o);
  const done = j ? Geo.sliceTo(route.points, clamp((j.totalKm - j.remainingKm) / j.factor, 0, n.along)) : null;
  const steps = [['CONFIRMED','Order confirmed'],['ACCEPTED','Restaurant accepted'],['PREPARING','Preparation started'],['READY','Food ready'],['ARRIVED','You arrived'],['COMPLETED','Served & completed']];
  const order_ = steps.map(s => s[0]); const curIdx = Math.max(0, order_.indexOf(o.status === 'SERVED' ? 'COMPLETED' : o.status));
  const cancelled = ['CANCELLED','REFUNDED'].includes(o.status);

function etaStats() {
  const done = DB.orders.filter(o => o.status === 'COMPLETED' && o.actual_arrival);
  const errs = done.map(o => Math.abs(mins(o.actual_arrival - o.eta_initial)));
  const lastErrs = done.map(o => { const logs = DB.eta_logs.filter(l => l.order_id === o.id && l.timestamp < o.actual_arrival - 15 * 60000); const last = logs[logs.length - 1]; return last ? Math.abs(mins(o.actual_arrival - last.estimated_arrival)) : null; }).filter(v => v !== null);
  const prep = done.filter(o => o.prep_started_at && o.food_ready_at).map(o => mins(o.food_ready_at - o.prep_started_at));
  const wait = done.filter(o => o.served_at).map(o => mins(o.served_at - o.actual_arrival));
  const avg = a => a.length ? Math.round(a.reduce((x, y) => x + y, 0) / a.length * 10) / 10 : 0;
  return { done, within10: done.length ? Math.round(errs.filter(e => e <= 10).length / done.length * 100) : 0, avgErr: avg(errs), avgLiveErr: avg(lastErrs), avgPrep: avg(prep), avgWait: avg(wait) };
}

function modal() {
  const m = S.modal; if (!m) return '';
  let inner = '';
  if (m.type === 'login') inner = loginModal();
  else if (m.type === 'pay') inner = payModal();
  else if (m.type === 'order') inner = orderDetailModal(order(m.id));
  else if (m.type === 'review') inner = reviewModal(order(m.id));
  else if (m.type === 'item') inner = itemModal(m.id ? DB.menu_items.find(x => x.id === m.id) : null);
  else if (m.type === 'verify') inner = verifyModal(order(m.id));
  else if (m.type === 'replace') inner = `<div class="modal-h"><h3>Start a new order?</h3><button class="iconbtn" data-act="close" aria-label="Close">${I.x}</button></div><div class="stack"><p>Your cart has dishes from ${esc(rest(S.cart.rid).name)}. Adding this item clears it, because each pre-order goes to one restaurant.</p><div class="row"><button class="btn btn-primary btn-lg grow" data-act="replacecart" data-id="${m.id}">Clear cart and add</button><button class="btn btn-outline btn-lg" data-act="close">Keep cart</button></div></div>`;
  else if (m.type === 'cancel') { const o = order(m.id); const pol = OrderService.cancelPolicy(o); inner = confirmModal('Cancel ' + o.order_number + '?', pol.allowed ? `You’ll get <b>${inr(pol.refund)}</b> back (${pol.pct}% of your advance) under the current policy.` : pol.reason, 'cancelyes', o.id); }
  else if (m.type === 'reject') { const o = order(m.id); inner = confirmModal('Reject ' + o.order_number + '?', `The customer gets a full refund of ${inr(o.advance_amount)} and an SMS. Rejections are tracked against your listing.`, 'rejectyes', o.id, `<div class="field"><label for="rj-reason">Reason</label><select class="input" id="rj-reason"><option>Item unavailable</option><option>Kitchen overloaded</option><option>Closing early today</option></select></div>`); }
  else if (m.type === 'arefund') { const o = order(m.id); inner = confirmModal('Refund ' + o.order_number + '?', `Cancels the order and refunds the full advance of ${inr(o.advance_amount)} to the customer.`, 'arefundyes', o.id); }
  else if (m.type === 'table') inner = `<div class="modal-h"><h3>Add table</h3><button class="iconbtn" data-act="close" aria-label="Close">${I.x}</button></div><form class="stack" data-form="table"><div class="form-grid two"><div class="field"><label for="tb-no">Table number</label><input class="input mono" id="tb-no" name="number" placeholder="T-20" required></div><div class="field"><label for="tb-cap">Capacity</label><input class="input" id="tb-cap" name="capacity" type="number" min="1" max="20" value="4"></div></div><button class="btn btn-primary btn-lg" type="submit">Add table</button></form>`;
  return `<div class="scrim" data-act="scrim"><div class="modal" role="dialog" aria-modal="true">${inner}</div></div>`;
}

function render() {
  const views = { home: viewHome, search: viewSearch, rest: viewRest, menu: viewMenu, checkout: viewCheckout, confirm: viewConfirm, track: viewTrack, account: viewAccount, partner: viewPartner, admin: viewAdmin, join: viewJoin, about: viewStatic, contact: viewStatic, legal: viewStatic };
  const active = document.activeElement; const activeId = active && active.id; const selStart = active && active.selectionStart;
  app.innerHTML = header() + `<main>${(views[S.view] || viewHome)()}</main>` + footer() + modal() + (S.toast ? `<div class="toast" role="status">${esc(S.toast)}</div>` : '');
  if (activeId) { const el = document.getElementById(activeId); if (el) { el.focus(); try { if (selStart != null) el.setSelectionRange(selStart, selStart); } catch (e) {} } }
  document.querySelectorAll('[data-qr]').forEach(el => { if (window.QRCode) { el.innerHTML = ''; new QRCode(el, { text: el.dataset.qr, width: 150, height: 150, colorDark: '#0B2318', colorLight: '#FFFFFF', correctLevel: QRCode.CorrectLevel.M }); } else el.innerHTML = `<div class="mono xs" style="width:150px;color:#0B2318;word-break:break-all">${esc(el.dataset.qr)}</div>`; });
}

/* ======================= EVENTS ======================= */
function requireCustomerSession(form) {
  let u = me();
  if (u && u.role === 'customer') return u;
  u = DB.users.find(x => x.role === 'customer' && (x.mobile === form.mobile || x.email.toLowerCase() === form.email.toLowerCase()));
  if (!u) { u = { id: uid('u'), name: form.name, mobile: form.mobile, email: form.email, role: 'customer', password: fakeHash(uid('pw')), created_at: simNow(), saved: { restaurants: [], routes: [] }, guest: true }; DB.users.push(u); }
  DB.sessionUserId = u.id; return u;
}
document.addEventListener('click', e => {
  const el = e.target.closest('[data-act]'); if (!el) { if (S.notifOpen && !e.target.closest('.card')) { S.notifOpen = false; render(); } return; }
  const a = el.dataset.act, id = el.dataset.id;
  if (a === 'scrim' && e.target !== el) return;
  switch (a) {
    case 'go': if (el.dataset.p) S.params = { p: el.dataset.p }; go(el.dataset.v, el.dataset.p ? { p: el.dataset.p } : {}); break;
    case 'nav': { const v = el.dataset.v; if (v === 'how') { go('home'); setTimeout(() => document.getElementById('how')?.scrollIntoView({ behavior: 'smooth' }), 30); } else go(v); break; }
    case 'burger': S.navOpen = !S.navOpen; render(); break;
    case 'notif': S.notifOpen = !S.notifOpen; render(); break;
    case 'readall': myNotifs().forEach(n => n.read = true); save(); render(); break;
    case 'login': S.signup = false; S.errors = {}; S.loginRole = el.dataset.role || S.loginRole || 'customer'; S.modal = { type: 'login' }; render(); break;
    case 'partnerlogin': S.signup = false; S.loginRole = 'restaurant'; S.modal = { type: 'login' }; render(); break;
    case 'signup': S.signup = true; S.errors = {}; S.modal = { type: 'login' }; render(); break;
    case 'lrole': S.loginRole = el.dataset.k; S.errors = {}; render(); break;
    case 'logout': DB.sessionUserId = null; save(); go('home'); toast('Logged out'); break;
    case 'close': case 'scrim': S.modal = null; S.errors = {}; S.payError = null; render(); break;
    case 'swap': { const f = document.getElementById('q-from'), t = document.getElementById('q-to'); [f.value, t.value] = [t.value, f.value]; break; }
    case 'popular': S.q = { ...S.q, from: 'Delhi', to: el.dataset.to }; S.results = null; S.selected = null; S.editSearch = false; go('search'); break;
    case 'routego': S.q = { ...S.q, from: el.dataset.from, to: el.dataset.to }; S.results = null; go('search'); break;
    case 'editsearch': S.editSearch = !S.editSearch; render(); break;
    case 'saveroute': { const u = me(); const k = S.results.route.id; if (!u.saved.routes.includes(k)) u.saved.routes.push(k); save(); toast('Route saved to your account'); break; }
    case 'saverest': { const u = me(); const L = u.saved.restaurants; const i = L.indexOf(id); i >= 0 ? L.splice(i, 1) : L.push(id); save(); render(); break; }
    case 'mview': S.mobileView = el.dataset.v; render(); break;
    case 'ftoggle': S.f[el.dataset.k] = !S.f[el.dataset.k]; render(); break;
    case 'fmore': S.filtersOpen = !S.filtersOpen; render(); break;
    case 'fclear': Object.keys(S.f).forEach(k => { if (typeof S.f[k] === 'boolean') S.f[k] = false; }); S.f.minRating = 0; S.f.maxDist = 8; S.f.maxDetour = 30; S.f.price = 0; render(); break;
    case 'sort': S.sort = el.dataset.k; render(); break;
    case 'marker': S.selected = id; if (window.innerWidth < 860) S.mobileView = 'map'; render(); if (window.innerWidth >= 1000) document.getElementById('card-' + id)?.scrollIntoView({ behavior: 'smooth', block: 'center' }); break;
    case 'unsel': S.selected = null; render(); break;
    case 'rest': go('rest', { id }); break;
    case 'menu': S.activeCat = null; go('menu', { id }); break;
    case 'cat': S.activeCat = el.dataset.c; render(); break;
    case 'add': { const rid = el.dataset.r; if (S.cart.rid && S.cart.rid !== rid && cartLines().length) { S.modal = { type: 'replace', id }; render(); break; } S.cart.rid = rid; S.cart.items[id] = 1; render(); break; }
    case 'replacecart': { const m = DB.menu_items.find(x => x.id === id); S.cart = { rid: m.restaurant_id, items: { [id]: 1 }, coupon: '' }; S.modal = null; render(); break; }
    case 'inc': S.cart.items[id] = (S.cart.items[id] || 0) + 1; render(); break;
    case 'dec': S.cart.items[id] = Math.max(0, (S.cart.items[id] || 0) - 1); if (!S.cart.items[id]) delete S.cart.items[id]; render(); break;
    case 'checkout': S.errors = {}; go('checkout'); break;
    case 'submitcheckout': document.querySelector('form[data-form="checkout"]').requestSubmit(); break;
    case 'pm': S.payMethod = el.value; render(); break;
    case 'paynow': case 'payfail': {
      const ctx = S.ctx; const gw = PaymentGateway.createOrder(ctx.price.advance); const res = PaymentGateway.capture(gw, S.payMethod || 'UPI', a === 'payfail');
      if (!res.ok) { S.payError = res.error; DB.payments.unshift({ id: uid('p'), order_id: null, amount: ctx.price.advance, payment_type: 'ADVANCE', method: S.payMethod || 'UPI', gateway: PaymentGateway.name, status: 'FAILED', transaction_id: gw.gateway_order_id, created_at: simNow() }); render(); break; }
      try { const o = OrderService.create(ctx, res); S.cart = { rid: null, items: {}, coupon: '' }; S.modal = null; S.payError = null; S.checkoutForm = null; go('confirm', { id: o.id }); }
      catch (err) { S.payError = err.message; render(); }
      break; }
    case 'track': go('track', { id }); break;
    case 'vieworder': S.modal = { type: 'order', id }; render(); break;
    case 'startjourney': EtaService.startJourney(order(id)); save(); render(); break;
    case 'jpause': { const j = order(id).journey; j.paused = !j.paused; save(); render(); break; }
    case 'jtraffic': { const o = order(id); o.journey.traffic = el.dataset.t; EtaService.recalc(o); PrepEngine.alert(o); save(); render(); break; }
    case 'jskip': { for (let i = 0; i < 5; i++) EtaService.tick(); render(); break; }
    case 'cancelask': S.modal = { type: 'cancel', id }; render(); break;
    case 'cancelyes': { const pol = OrderService.cancel(order(id), 'customer'); S.modal = null; render(); toast(pol.refund ? `Cancelled. ${inr(pol.refund)} refund initiated.` : 'Order cancelled'); break; }
    case 'review': S.rv = { food: 5, rest: 5, service: 5, eta: 5, overall: 5 }; S.modal = { type: 'review', id }; render(); break;
    case 'rvset': S.rv[el.dataset.k] = +el.dataset.n; { const c = document.getElementById('rv-c')?.value; render(); if (c) document.getElementById('rv-c').value = c; } break;
    case 'atab': S.accountTab = el.dataset.k; render(); break;
    case 'ptab': S.partnerTab = el.dataset.k; if (el.dataset.k === 'notifications') { DB.notifications.filter(n => n.to.role === 'restaurant' && n.to.id === me().restaurant_id).forEach(n => n.read = true); save(); } render(); break;
    case 'adtab': S.adminTab = el.dataset.k; render(); break;
    case 'aofilter': S.adminOrderFilter = el.dataset.k; render(); break;
    case 'accept': OrderService.setStatus(order(id), 'ACCEPTED'); toast('Order accepted. Preparation timing is now live.'); break;
    case 'startprep': OrderService.setStatus(order(id), 'PREPARING'); render(); break;
    case 'ready': OrderService.setStatus(order(id), 'READY'); render(); break;
    case 'verify': S.errors = {}; S.modal = { type: 'verify', id }; render(); break;
    case 'vffill': { const o = order(id); document.getElementById('vf-qr').value = o.qr; break; }
    case 'serve': OrderService.setStatus(order(id), 'SERVED'); toast('Served. Balance collected and order completed.'); break;
    case 'reject': S.modal = { type: 'reject', id }; render(); break;
    case 'rejectyes': { const reason = document.getElementById('rj-reason')?.value; OrderService.cancel(order(id), 'restaurant', 'Rejected by restaurant: ' + reason); S.modal = null; render(); toast('Order rejected and refunded'); break; }
    case 'toggleavail': { const m = DB.menu_items.find(x => x.id === id); m.available = !m.available; save(); render(); break; }
    case 'additem': S.modal = { type: 'item' }; render(); break;
    case 'edititem': S.modal = { type: 'item', id }; render(); break;
    case 'delitem': DB.menu_items = DB.menu_items.filter(x => x.id !== id); save(); render(); toast('Item deleted'); break;
    case 'addtable': S.modal = { type: 'table' }; render(); break;
    case 'rstatus': { const r = rest(id); r.status = el.dataset.s; Notifier.send({ role: 'restaurant', id: r.id }, 'listing', 'Listing ' + r.status.toLowerCase(), `${r.name} is now ${r.status}.`, ['email','sms']); S.results = null; save(); render(); toast(`${r.name}: ${r.status}`); break; }
    case 'adminrefund': S.modal = { type: 'arefund', id }; render(); break;
    case 'arefundyes': OrderService.cancel(order(id), 'admin', 'Refunded by Food on Way support'); S.modal = null; render(); toast('Refund issued'); break;
    case 'delreview': DB.reviews = DB.reviews.filter(v => v.id !== id); save(); render(); break;
    case 'coupontoggle': { const c = DB.coupons.find(x => x.code === el.dataset.k); c.active = !c.active; save(); render(); break; }
    case 'reset': DB = seed(); save(); seedOrders(); S.results = null; S.cart = { rid: null, items: {}, coupon: '' }; go('home'); toast('Demo data reset'); break;
  }
});
document.addEventListener('change', e => {
  const t = e.target;
  if (t.dataset.fset) { S.f[t.dataset.fset] = +t.value; render(); }
  if (t.dataset.tstatus) { const x = DB.tables.find(y => y.id === t.dataset.tstatus); x.status = t.value; save(); render(); }
  if (t.dataset.feature) { rest(t.dataset.feature).featured = t.checked; save(); }
});
document.addEventListener('submit', e => {
  const f = e.target; const kind = f.dataset.form; if (!kind) return; e.preventDefault();
  const d = Object.fromEntries(new FormData(f).entries());
  const errs = {};
  if (kind === 'search') {
    const route = RouteProvider.getRoute(d.from, d.to);
    S.q = { from: normCity(d.from) || d.from, to: normCity(d.to) || d.to, date: d.date, time: d.time };
    if (!route) { S.errors.search = 'We cover routes between Delhi and Dehradun, Haridwar, Rishikesh, Jaipur, Agra, Mathura, Vrindavan and Chandigarh.'; render(); return; }
    S.errors = {}; S.results = null; S.selected = null; S.editSearch = false; go('search'); return;
  }
  if (kind === 'checkout') {
    S.checkoutForm = d;
    if (!d.name || d.name.trim().length < 2) errs.name = 'Enter your name.';
    if (!/^[6-9]\d{9}$/.test(d.mobile || '')) errs.mobile = 'Enter a 10-digit Indian mobile number.';
    if (!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(d.email || '')) errs.email = 'Enter a valid email address.';
    if (+d.diners < 1) errs.diners = 'At least one diner.';
    S.cart.coupon = (d.coupon || '').trim().toUpperCase();
    if (S.cart.coupon && !DB.coupons.find(c => c.code === S.cart.coupon && c.active)) { errs.coupon = 'This coupon isn’t valid.'; S.cart.coupon = ''; }
    S.errors = errs; if (Object.keys(errs).length) { render(); document.querySelector('.err')?.closest('.field')?.querySelector('input')?.focus(); return; }
    const x = ctxFor(S.cart.rid);
    if (!x.openAtEta) { toast('The restaurant is closed at your arrival time'); return; }
    const u = requireCustomerSession(d);
    const lines = cartLines();
    S.ctx = { rid: S.cart.rid, lines, price: OrderService.price(S.cart.rid, lines, S.cart.coupon), customerId: u.id, from: S.results.route.from, to: S.results.route.to, eta: x.eta, traffic: x.traffic, delayMin: x.delayMin, distKm: x.distKm, name: d.name.trim(), mobile: d.mobile, email: d.email.trim(), people: +d.people || 1, diners: +d.diners || 1, instructions: (d.instructions || '').slice(0, 300), vehicle: d.vehicle };
    S.payMethod = 'UPI'; S.payError = null; S.modal = { type: 'pay' }; save(); render(); return;
  }
  if (kind === 'login') {
    const u = user(d.acct);
    const expected = u && (u.role === 'admin' ? 'admin1234' : u.role === 'restaurant' ? 'partner1234' : 'demo1234');
    if (!u || (fakeHash(d.password) !== u.password && d.password !== expected)) { S.errors.login = 'Incorrect password. Demo passwords are pre-filled.'; render(); return; }
    if (u.role === 'restaurant' && rest(u.restaurant_id).status !== 'APPROVED') { S.errors.login = `This restaurant is ${rest(u.restaurant_id).status}. The dashboard opens after admin approval.`; render(); return; }
    DB.sessionUserId = u.id; save(); S.modal = null; S.errors = {};
    go(u.role === 'admin' ? 'admin' : u.role === 'restaurant' ? 'partner' : (S.view === 'checkout' ? 'checkout' : 'account'));
    toast('Welcome, ' + firstName(u.name)); return;
  }
  if (kind === 'signup') {
    if (!/^[6-9]\d{9}$/.test(d.mobile)) { S.errors.signup = 'Enter a 10-digit Indian mobile number.'; render(); return; }
    if (DB.users.some(x => x.email.toLowerCase() === d.email.toLowerCase())) { S.errors.signup = 'An account with this email exists. Log in instead.'; render(); return; }
    const u = { id: uid('u'), name: d.name.trim(), mobile: d.mobile, email: d.email.trim(), role: 'customer', password: fakeHash(d.password), created_at: simNow(), saved: { restaurants: [], routes: [] } };
    DB.users.push(u); DB.sessionUserId = u.id; save(); S.modal = null; go('account'); toast('Account created'); return;
  }
  if (kind === 'profile') { const u = me(); Object.assign(u, { name: d.name, mobile: d.mobile, email: d.email }); save(); toast('Profile saved'); return; }
  if (kind === 'review') { const o = order(f.dataset.id); ReviewService.add(o, { ...S.rv, comment: (d.comment || '').slice(0, 600) }); S.modal = null; render(); toast('Thanks! Your verified review is live.'); return; }
  if (kind === 'item') {
    const r = rest(me().restaurant_id); const id = f.dataset.id;
    const vals = { name: d.name.trim(), category: d.category.trim(), price: Math.max(1, +d.price), prep: clamp(+d.prep, 1, 90), veg: d.veg === '1', description: d.description || '', available: !!d.available };
    if (id) Object.assign(DB.menu_items.find(x => x.id === id), vals); else DB.menu_items.push({ id: uid(r.id + '_m'), restaurant_id: r.id, image: null, ...vals });
    save(); S.modal = null; render(); toast(id ? 'Item updated' : 'Item added to menu'); return;
  }
  if (kind === 'table') {
    const rid = me().restaurant_id; const num = d.number.trim().toUpperCase();
    if (DB.tables.some(t => t.restaurant_id === rid && t.number === num)) { toast('That table number already exists'); return; }
    DB.tables.push({ id: uid(rid + '_t'), restaurant_id: rid, number: num, capacity: +d.capacity || 4, status: 'AVAILABLE' }); save(); S.modal = null; render(); toast('Table added'); return;
  }
  if (kind === 'verify') {
    const o = order(f.dataset.id); let no = (d.no || '').trim().toUpperCase(), tb = (d.table || '').trim().toUpperCase();
    if (d.qr) { try { const q = JSON.parse(d.qr); no = q.o; tb = q.t || ''; if (q.r !== o.restaurant_id) { S.errors.verify = 'This QR belongs to another restaurant.'; render(); return; } } catch (err) { S.errors.verify = 'QR data could not be read.'; render(); return; } }
    if (no !== o.order_number) { S.errors.verify = 'Order number does not match ' + o.order_number + '.'; render(); return; }
    if (o.table_number && tb && tb !== o.table_number) { S.errors.verify = `Table mismatch: this order is reserved at ${o.table_number}.`; render(); return; }
    OrderService.setStatus(o, 'ARRIVED'); S.modal = null; S.errors = {}; render(); toast('Customer arrived. Seat them at ' + (o.table_number || 'a free table')); return;
  }
  if (kind === 'rprofile') {
    const r = rest(me().restaurant_id);
    Object.assign(r, { name: d.name, cuisine: d.cuisine.split(',').map(s => s.trim()).filter(Boolean), address: d.address, avgPrep: +d.avgPrep, costForTwo: +d.costForTwo, about: d.about });
    ['parking','washroom','family','ac','kids','ev'].forEach(k => r.facilities[k] = !!d['fac_' + k]); save(); S.results = null; toast('Profile saved'); return;
  }
  if (kind === 'rhours') { const r = rest(me().restaurant_id); if (d.h24) { r.open = '00:00'; r.close = '24:00'; } else { r.open = d.open; r.close = d.close; } save(); S.results = null; render(); toast('Opening hours saved'); return; }
  if (kind === 'settings') {
    Object.keys(DB.settings).forEach(k => { if (d[k] !== undefined) DB.settings[k] = k === 'rejectRule' ? d[k] : +d[k]; });
    S.results = null; save(); render(); toast('Settings saved. New orders use the new rules.'); return;
  }
  if (kind === 'coupon') { const code = d.code.trim().toUpperCase(); if (DB.coupons.some(c => c.code === code)) { toast('Coupon already exists'); return; } DB.coupons.unshift({ code, pct: +d.pct, max: +d.max, active: true, uses: 0 }); save(); render(); toast('Coupon added'); return; }
  if (kind === 'contact') { f.reset(); toast('Message sent. We reply within one working day.'); return; }
  if (kind === 'join') {
    const req = ['name','owner','mobile','email','password','address','lat','lng','open','close','cuisine','prep','fssai','pan','bank','ifsc'];
    req.forEach(k => { if (!d[k] || !String(d[k]).trim()) errs[k] = 'Required'; });
    if (d.mobile && !/^[6-9]\d{9}$/.test(d.mobile)) errs.mobile = 'Enter a 10-digit mobile number';
    if (d.email && !/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(d.email)) errs.email = 'Enter a valid email';
    if (d.password && d.password.length < 8) errs.password = 'At least 8 characters';
    if (d.fssai && !/^\d{14}$/.test(d.fssai)) errs.fssai = 'FSSAI number has 14 digits';
    if (d.pan && !/^[A-Z]{5}\d{4}[A-Z]$/i.test(d.pan)) errs.pan = 'Format: ABCDE1234F';
    if (d.lat && (+d.lat < 6 || +d.lat > 37)) errs.lat = 'Latitude must be inside India';
    if (d.lng && (+d.lng < 68 || +d.lng > 98)) errs.lng = 'Longitude must be inside India';
    S.errors = errs;
    if (Object.keys(errs).length) { render(); document.querySelector('.err')?.closest('.field')?.querySelector('input')?.focus(); toast('Please fix the highlighted fields'); return; }
    const id = uid('r');
    const r = { id, name: d.name.trim(), type: d.type, lat: +d.lat, lng: +d.lng, rating: 0, reviews: 0, open: d.open, close: d.close, cuisine: d.cuisine.split(',').map(s => s.trim()), vegType: d.veg, avgPrep: +d.prep, priceLevel: 2, costForTwo: 500, address: d.address, owner: d.owner, ownerUserId: 'u_' + id, mobile: d.mobile, email: d.email, hue: hashN(id) % 360, facilities: Object.fromEntries(['parking','washroom','family','ac','kids','ev'].map(k => [k, !!d['fac_' + k]])), about: 'New partner on Food on Way.', status: 'PENDING', demo: false, featured: false, created_at: simNow(), gstin: d.gstin, fssai: d.fssai, bank: 'A/c •••• ' + d.bank.slice(-4) + ' · ' + d.ifsc.toUpperCase() };
    DB.restaurants.push(r);
    DB.users.push({ id: r.ownerUserId, name: d.owner, mobile: d.mobile, email: d.email, role: 'restaurant', restaurant_id: id, password: fakeHash(d.password), created_at: simNow() });
    for (let t = 1; t <= 6; t++) DB.tables.push({ id: id + '_t' + t, restaurant_id: id, number: 'T-' + t, capacity: 4, status: 'AVAILABLE' });
    Notifier.send({ role: 'admin', id: 'u3' }, 'listing', 'New restaurant application', `${r.name} (${r.owner}) is waiting for approval.`, ['email']);
    S.joined = { email: d.email }; save(); render(); window.scrollTo({ top: 0 }); return;
  }
});

document.addEventListener('keydown', e => { if ((e.key === 'Enter' || e.key === ' ') && e.target.matches('g[data-act]')) { e.preventDefault(); e.target.dispatchEvent(new MouseEvent('click', { bubbles: true })); } if (e.key === 'Escape' && S.modal) { S.modal = null; render(); } });
/* live loop: GPS/traffic events (mock) */
setInterval(() => {
  const moved = EtaService.tick();
  if (moved && !S.modal && ['track','partner','admin','confirm','account'].includes(S.view)) {
    const a = document.activeElement; if (a && ['INPUT','TEXTAREA','SELECT'].includes(a.tagName)) return;
    const y = window.scrollY; render(); window.scrollTo(0, y);
  }
}, CONFIG.tickMs);

render();
</script>
</body>
